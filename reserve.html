  <!-- 予約フォーム -->
  <main class="reserve-container wrapper">
    
    <div class="section-label-container">
      <h2 class="section-label fadein">予約フォーム</h2>
    </div>

    <!-- フォーム -->
    <form class="reserve-form-box fadein" action="#" method="post" onsubmit="alert('予約が完了しました！'); return false;">
      
      <!-- お名前 -->
      <div class="form-item">
        <label>お名前</label>
        <input type="text" name="name" placeholder="例) 山田 太郎">
      </div>

      <!-- メールアドレス -->
      <div class="form-item">
        <label>メールアドレス</label>
        <input type="email" name="email" placeholder="例) example@example.com">
      </div>

      <!-- 作品 & 上映時間 -->
      <div class="form-row">
        <div class="form-item flex-2">
          <label>作品</label>
          <select name="movie">
            <option value="" disabled selected>選択してください</option>
            <option value="movie1">作品A</option>
            <option value="movie2">作品B</option>
            <option value="movie3">作品C</option>
            <option value="movie4">作品D</option>
            <option value="movie5">作品E</option>
            <option value="movie6">作品F</option>
            <option value="movie7">作品G</option>
            <option value="movie8">作品H</option>
            <option value="movie9">作品I</option>
            <option value="movie10">作品J</option>
            <option value="movie11">作品K</option>
            <option value="movie12">作品L</option>
            <option value="movie13">作品M</option>
            <option value="movie14">作品N</option>
            <option value="movie15">作品O</option>
          </select>
        </div>

        <div class="form-item flex-1">
          <label>上映時間</label>
          <select name="time">
            <option value="" disabled selected>選択してください</option>
            <option value="10:00 - 12:15">10:00 - 12:15</option>
            <option value="13:30 - 15:45">13:30 - 15:45</option>
            <option value="18:00 - 20:15">18:00 - 20:15</option>
          </select>
        </div>
      </div>

      <!-- 座席 -->
      <div class="form-item form-item-short">
        <label>座席</label>
        <select name="seat">
          <option value="" disabled selected>選択してください</option>
          <option value="A-1">A-1 (前方)</option>
          <option value="A-2">A-2 (前方)</option>
          <option value="B-3">B-3 (中央)</option>
          <option value="B-4">B-4 (中央)</option>
          <option value="C-5">C-5 (後方)</option>
        </select>
      </div>

      <!-- お問い合わせ -->
      <div class="form-item">
        <label>お問い合わせ（任意）</label>
        <textarea name="message" rows="4" placeholder="ご質問などがあればご記入ください。"></textarea>
      </div>

      <!-- 送信ボタン -->
      <div class="form-submit-container">
        <button type="submit" class="submit-btn">予約する</button>
      </div>

    </form>

  </main>

  <!-- フッター -->
  <footer class="footer">
    <p>&copy; 2026 WCB CINEMA.</p>
  </footer>

</body>
